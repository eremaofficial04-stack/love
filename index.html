<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для тебя 💖</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', 'Helvetica', sans-serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fbc2eb 100%);
    overflow: hidden;
    position: relative;
    padding: 20px;
  }

  /* падающие сердечки */
  .heart {
    position: fixed;
    top: -10vh;
    font-size: 24px;
    animation: fall linear infinite;
    opacity: 0.8;
    pointer-events: none;
    z-index: 1;
  }
  @keyframes fall {
    to { transform: translateY(120vh) rotate(360deg); }
  }

  .card {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 40px 28px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(255, 100, 150, 0.35);
    animation: appear 1.2s ease;
  }
  @keyframes appear {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  h1 {
    font-size: 26px;
    color: #d6336c;
    margin-bottom: 18px;
  }

  .message {
    font-size: 17px;
    line-height: 1.7;
    color: #444;
    margin-bottom: 28px;
    white-space: pre-line;
  }

  button {
    background: linear-gradient(135deg, #ff6b9d, #d6336c);
    color: #fff;
    border: none;
    padding: 15px 38px;
    border-radius: 50px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(214, 51, 108, 0.4);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  button:active {
    transform: scale(0.95);
    box-shadow: 0 5px 15px rgba(214, 51, 108, 0.6);
  }

  .answer {
    margin-top: 22px;
    font-size: 20px;
    color: #d6336c;
    font-weight: 700;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.6s ease;
  }
  .answer.show {
    opacity: 1;
    transform: scale(1);
  }
</style>
</head>
<body>

  <div class="card">
    <h1>Привет, любимая 💕</h1>
    <p class="message">Каждый день с тобой — это лучшее,
что случалось со мной.

Ты — моё вдохновение, мой покой
и моё счастье.</p>
    <button onclick="showLove()">Нажми на меня 💗</button>
    <div class="answer" id="answer">Я тебя очень люблю! 💖</div>
  </div>

<script>
  // Падающие сердечки
  const hearts = ['💖','💕','💗','❤️','🌸','💘'];
  for (let i = 0; i < 20; i++) {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = hearts[Math.floor(Math.random()*hearts.length)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.animationDuration = (5 + Math.random()*6) + 's';
    h.style.animationDelay = (Math.random()*5) + 's';
    h.style.fontSize = (16 + Math.random()*24) + 'px';
    document.body.appendChild(h);
  }

  // Кнопка
  function showLove() {
    document.getElementById('answer').classList.add('show');
  }
</script>
</body>
</html>
